name: TSX PRO FIXLAG build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Tao du an
        run: |
          mkdir -p app/src/main/java/com/tsxpro/fixlag app/src/main/res/drawable
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'TSXFixlag'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.tsxpro.fixlag'
            compileSdk 34
            defaultConfig {
              applicationId 'com.tsxpro.fixlag'
              minSdk 24
              targetSdk 34
              versionCode 2
              versionName '0.2'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
              encoding = 'UTF-8'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
            <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
            <application android:label="TSX PRO FIXLAG" android:icon="@drawable/ic_launcher"
                android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          cat > app/src/main/res/drawable/ic_launcher.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0D47A1" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFC107" android:pathData="M60,18L36,60h16l-6,30l28,-44H58z"/>
          </vector>
          EOF
          cat > app/src/main/java/com/tsxpro/fixlag/MainActivity.java <<'EOF'
          package com.tsxpro.fixlag;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              static final String CMD = "adb shell pm grant com.tsxpro.fixlag android.permission.WRITE_SECURE_SETTINGS";
              static final String[] KEYS = {
                  Settings.Global.WINDOW_ANIMATION_SCALE,
                  Settings.Global.TRANSITION_ANIMATION_SCALE,
                  Settings.Global.ANIMATOR_DURATION_SCALE };
              SharedPreferences sp;
              TextView status, ram;
              Switch swHalf, swOff;
              LinearLayout root;
              boolean busy;

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              TextView text(String s, int size, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(0, dp(8), 0, dp(4));
                  if (bold) t.setTypeface(null, Typeface.BOLD);
                  root.addView(t);
                  return t;
              }

              Button button(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setOnClickListener(l);
                  root.addView(b);
                  return b;
              }

              Switch sw(String s) {
                  Switch w = new Switch(this);
                  w.setText(s);
                  w.setTextColor(Color.WHITE);
                  w.setTextSize(16);
                  w.setPadding(0, dp(10), 0, dp(10));
                  root.addView(w);
                  return w;
              }

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  sp = getSharedPreferences("fx", MODE_PRIVATE);
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.parseColor("#121212"));
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(32), dp(16), dp(24));
                  sv.addView(root);
                  setContentView(sv);

                  text("TSX PRO FIXLAG", 24, true);
                  status = text("", 14, false);
                  text("Chức năng", 18, true);
                  button("Dọn RAM ngay", v -> cleanRam(null));
                  ram = text("", 13, false);
                  button("Boost & chơi Minecraft", v -> cleanRam("com.mojang.minecraftpe"));
                  button("Boost & chơi Roblox", v -> cleanRam("com.roblox.client"));

                  text("Đồ họa (giảm tải CPU/GPU)", 18, true);
                  swHalf = sw("Giảm hiệu ứng (0.5x)");
                  swOff = sw("Tắt hiệu ứng (0x)");
                  swHalf.setOnCheckedChangeListener((c, on) -> { if (!busy) setAnim(on ? 0.5f : -1f); });
                  swOff.setOnCheckedChangeListener((c, on) -> { if (!busy) setAnim(on ? 0f : -1f); });
                  button("Mở Tùy chọn nhà phát triển", v -> openDev());
                  text("Mẹo trong game:\n• Minecraft: Cài đặt → Video: giảm Render Distance (4-6), tắt Fancy Graphics, Beautiful Skies\n• Roblox: Cài đặt → Graphics Mode: Manual, kéo Graphics Quality xuống 1-3\n• Tắt Tiết kiệm pin khi chơi, để máy nguội khi nóng", 13, false);
              }

              @Override
              protected void onResume() { super.onResume(); refresh(); }

              boolean canWrite() {
                  return checkSelfPermission("android.permission.WRITE_SECURE_SETTINGS") == PackageManager.PERMISSION_GRANTED;
              }

              void refresh() {
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  StringBuilder s = new StringBuilder();
                  s.append("Tiết kiệm pin: ").append(pm.isPowerSaveMode() ? "BẬT (làm máy chậm, nên tắt khi chơi game)" : "tắt").append("\n");
                  if (Build.VERSION.SDK_INT >= 29) {
                      s.append("Nhiệt độ: ").append(pm.getCurrentThermalStatus() >= PowerManager.THERMAL_STATUS_MODERATE ? "NÓNG (máy đang bị giảm hiệu năng)" : "bình thường").append("\n");
                  }
                  s.append("Quyền đổi hiệu ứng: ").append(canWrite() ? "đã cấp" : "chưa cấp");
                  status.setText(s.toString());
                  float v = Settings.Global.getFloat(getContentResolver(), KEYS[0], 1f);
                  busy = true;
                  swHalf.setChecked(v == 0.5f);
                  swOff.setChecked(v == 0f);
                  busy = false;
              }

              void setAnim(float v) {
                  if (!canWrite()) {
                      refresh();
                      showGuide();
                      return;
                  }
                  try {
                      ContentResolver cr = getContentResolver();
                      if (v < 0) {
                          for (int i = 0; i < 3; i++) Settings.Global.putFloat(cr, KEYS[i], sp.getFloat("o" + i, 1f));
                          sp.edit().remove("o0").apply();
                      } else {
                          if (!sp.contains("o0")) {
                              SharedPreferences.Editor ed = sp.edit();
                              for (int i = 0; i < 3; i++) ed.putFloat("o" + i, Settings.Global.getFloat(cr, KEYS[i], 1f));
                              ed.apply();
                          }
                          for (int i = 0; i < 3; i++) Settings.Global.putFloat(cr, KEYS[i], v);
                      }
                  } catch (Exception e) {
                      toast("Lỗi: " + e.getMessage());
                  }
                  refresh();
              }

              void cleanRam(final String game) {
                  final ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  final PackageManager pm = getPackageManager();
                  final long before = avail(am);
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0 || ai.packageName.equals(getPackageName())) continue;
                      am.killBackgroundProcesses(ai.packageName);
                  }
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      long after = avail(am);
                      ram.setText("RAM trống: " + after + " MB (+" + Math.max(0L, after - before) + " MB)");
                      if (game != null) {
                          Intent it = pm.getLaunchIntentForPackage(game);
                          if (it == null) toast("Chưa cài game này"); else startActivity(it);
                      }
                  }, 1500);
              }

              long avail(ActivityManager am) {
                  ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                  am.getMemoryInfo(mi);
                  return mi.availMem / 1048576L;
              }

              void openDev() {
                  try { startActivity(new Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS)); }
                  catch (Exception e) { toast("Hãy bật Tùy chọn nhà phát triển: bấm 7 lần vào Số bản dựng trong Giới thiệu điện thoại"); }
              }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_LONG).show(); }

              void showGuide() {
                  new AlertDialog.Builder(this)
                      .setTitle("Cần cấp quyền 1 lần")
                      .setMessage("Cách 1 (máy tính, hoặc Shizuku/ADB không dây): chạy lệnh\n\n" + CMD + "\n\nCách 2 (làm tay): vào Tùy chọn nhà phát triển, đặt 3 mục Tỷ lệ hoạt ảnh (cửa sổ, chuyển tiếp, thời lượng) về 0.5x hoặc tắt.")
                      .setPositiveButton("Sao chép lệnh", (d, w) -> {
                          ((ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE)).setPrimaryClip(ClipData.newPlainText("cmd", CMD));
                          toast("Đã sao chép");
                      })
                      .setNegativeButton("Mở Tùy chọn NPT", (d, w) -> openDev())
                      .setNeutralButton("Đóng", null)
                      .show();
              }
          }
          EOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TSX-PRO-FIXLAG-apk
          path: app/build/outputs/apk/debug/app-debug.apk
