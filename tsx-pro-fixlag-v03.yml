name: TSX PRO FIXLAG v0.3 build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Extract icon từ APK cũ
        run: |
          python3 - <<'PEOF'
          import urllib.request, zipfile, io, os
          try:
              url = 'https://github.com/TUANPRO-vip/Fixlag/releases/download/v0.1/app-debug.apk'
              print(f"Tải APK cũ từ {url}...")
              with urllib.request.urlopen(url, timeout=10) as r:
                  apk = r.read()
              print(f"Giải nén APK ({len(apk)} bytes)...")
              with zipfile.ZipFile(io.BytesIO(apk)) as z:
                  for name in z.namelist():
                      if 'logo_tsx' in name and name.endswith('.png'):
                          print(f"Tìm thấy logo: {name}")
                          with open('logo.png', 'wb') as f:
                              f.write(z.read(name))
                          print(f"Lưu logo.png ({os.path.getsize('logo.png')} bytes)")
                          break
                  else:
                      print("Không tìm thấy logo_tsx.png, dùng icon mặc định")
          except Exception as e:
              print(f"Lỗi tải APK: {e}")
              print("Sẽ dùng icon mặc định")
          PEOF
      - name: Tao du an v0.3
        run: |
          mkdir -p app/src/main/java/com/tsxpro/fixlag app/src/main/res/{drawable,mipmap}
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'TSXFixlag'
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.tsxpro.fixlag'
            compileSdk 34
            defaultConfig {
              applicationId 'com.tsxpro.fixlag'
              minSdk 24
              targetSdk 34
              versionCode 3
              versionName '0.3'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
              encoding = 'UTF-8'
            }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
            <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS"/>
            <uses-permission android:name="android.permission.CHANGE_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.WRITE_SETTINGS"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application android:label="TSX PRO FIXLAG" android:icon="@mipmap/ic_launcher"
                android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF
          # Icon (co san logo.png hoac dung default)
          if [ -f logo.png ]; then
            cp logo.png app/src/main/res/mipmap/ic_launcher.png
          else
            cat > app/src/main/res/mipmap/ic_launcher.xml <<'XEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0D47A1" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#FFC107" android:pathData="M60,18L36,60h16l-6,30l28,-44H58z"/>
          </vector>
          XEOF
          fi
          cat > app/src/main/java/com/tsxpro/fixlag/MainActivity.java <<'JEOF'
          package com.tsxpro.fixlag;

          import android.app.Activity;
          import android.app.ActivityManager;
          import android.app.AlertDialog;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.ContentResolver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.net.ConnectivityManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.provider.Settings;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.File;
          import java.util.List;

          public class MainActivity extends Activity {
              static final String CMD_ANIM = "adb shell pm grant com.tsxpro.fixlag android.permission.WRITE_SECURE_SETTINGS";
              static final String[] ANIM_KEYS = {
                  Settings.Global.WINDOW_ANIMATION_SCALE,
                  Settings.Global.TRANSITION_ANIMATION_SCALE,
                  Settings.Global.ANIMATOR_DURATION_SCALE };
              static final String[] VIB_KEYS = {
                  Settings.System.HAPTIC_FEEDBACK_ENABLED,
                  Settings.System.NOTIFICATION_VIBRATION_INTENSITY,
                  "vibration_intensity" };
              SharedPreferences sp;
              TextView status, ram, info;
              Switch swAnim, swVib, swGesture;
              LinearLayout root;
              boolean busy;

              int dp(int v) { return (int) (v * getResources().getDisplayMetrics().density); }

              TextView text(String s, int size, boolean bold) {
                  TextView t = new TextView(this);
                  t.setText(s);
                  t.setTextSize(size);
                  t.setTextColor(Color.WHITE);
                  t.setPadding(0, dp(8), 0, dp(4));
                  if (bold) t.setTypeface(null, Typeface.BOLD);
                  root.addView(t);
                  return t;
              }

              Button button(String s, View.OnClickListener l) {
                  Button b = new Button(this);
                  b.setText(s);
                  b.setOnClickListener(l);
                  b.setTextSize(14);
                  root.addView(b);
                  return b;
              }

              Switch sw(String s) {
                  Switch w = new Switch(this);
                  w.setText(s);
                  w.setTextColor(Color.WHITE);
                  w.setTextSize(14);
                  w.setPadding(0, dp(10), 0, dp(10));
                  root.addView(w);
                  return w;
              }

              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  sp = getSharedPreferences("tsx", MODE_PRIVATE);
                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Color.parseColor("#1a1a1a"));
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(24), dp(16), dp(24));
                  sv.addView(root);
                  setContentView(sv);

                  text("⚡ TSX PRO FIXLAG v0.3", 22, true);
                  status = text("", 12, false);
                  text("", 4, false); // spacer

                  text("🎮 CHỨC NĂNG CƠ BẢN", 16, true);
                  button("⬆ Dọn RAM & Cache ngay", v -> cleanAll());
                  ram = text("", 12, false);
                  button("🎮 Boost & mở Minecraft PE", v -> cleanAll("com.mojang.minecraftpe"));
                  button("🎮 Boost & mở Roblox", v -> cleanAll("com.roblox.client"));

                  text("", 4, false);
                  text("⚙ TẮTHOẠT ĐỘC HỌA & HIỆU ỨNG", 16, true);
                  swAnim = sw("🚫 Tắt hiệu ứng chuyển tiếp");
                  swVib = sw("📳 Tắt rung (vibration)");
                  swGesture = sw("👆 Tắt gesture hints");
                  swAnim.setOnCheckedChangeListener((c, on) -> { if (!busy) toggleAnim(on); });
                  swVib.setOnCheckedChangeListener((c, on) -> { if (!busy) toggleVib(on); });
                  swGesture.setOnCheckedChangeListener((c, on) -> { if (!busy) toggleGesture(on); });
                  button("🔧 Mở Developer Settings (tối ưu thêm)", v -> openDev());

                  text("", 4, false);
                  text("💡 TỐI ƯU HỆ THỐNG", 16, true);
                  button("🧹 Xóa cache tất cả app", v -> clearCache());
                  button("📱 Tắt WiFi/Bluetooth khi chơi", v -> toggleConnectivity(false));
                  button("📱 Bật WiFi/Bluetooth lại", v -> toggleConnectivity(true));
                  button("🔋 Tắt Adaptive Battery", v -> toggleAdaptive());
                  button("🎯 Mở Performance Settings", v -> openPerf());

                  text("", 4, false);
                  text("📖 MẸO CHƠI", 14, true);
                  text("Minecraft PE:\n  • Giảm Render Distance (4-6)\n  • Tắt Fancy Graphics\n  • Tắt Beautiful Skies\n\nRoblox:\n  • Graphics Quality → 1-3\n  • Turn off Ambient Shadows\n\nChung: tắt Tiết kiệm pin, để máy nguội", 12, false);
                  info = text("", 11, false);
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  refresh();
              }

              boolean canWrite() {
                  return checkSelfPermission("android.permission.WRITE_SECURE_SETTINGS") == PackageManager.PERMISSION_GRANTED
                      || checkSelfPermission("android.permission.WRITE_SETTINGS") == PackageManager.PERMISSION_GRANTED;
              }

              void refresh() {
                  PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                  ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  
                  StringBuilder s = new StringBuilder();
                  s.append("✓ Tiết kiệm pin: ").append(pm.isPowerSaveMode() ? "BẬT (tắt khi chơi!)" : "tắt (tốt)");
                  if (Build.VERSION.SDK_INT >= 29) {
                      int temp = pm.getCurrentThermalStatus();
                      s.append("\n✓ Nhiệt: ").append(temp >= PowerManager.THERMAL_STATUS_MODERATE ? "NÓNG! (⚠ máy đang giảm tốc)" : "bình thường (tốt)");
                  }
                  s.append("\n✓ Quyền viết: ").append(canWrite() ? "✅ có (có thể tắt hiệu ứng)" : "❌ chưa (cần chạy lệnh ADB)");
                  s.append("\n✓ RAM: ").append(avail(am)).append(" MB trống");
                  status.setText(s.toString());
                  
                  try {
                      float v = Settings.Global.getFloat(getContentResolver(), ANIM_KEYS[0], 1f);
                      busy = true;
                      swAnim.setChecked(v < 0.5f);
                      swVib.setChecked(getVibState());
                      swGesture.setChecked(getGestureState());
                      busy = false;
                  } catch (Exception e) {}
                  
                  info.setText("App: v0.3 | Fix lag & tối ưu hệ thống | Cần cấp quyền ADB 1 lần");
              }

              void cleanAll(String game) {
                  ActivityManager am = (ActivityManager) getSystemService(Context.ACTIVITY_SERVICE);
                  PackageManager pm = getPackageManager();
                  long before = avail(am);
                  
                  for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                      if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0 || ai.packageName.equals(getPackageName())) continue;
                      am.killBackgroundProcesses(ai.packageName);
                  }
                  
                  new Handler(Looper.getMainLooper()).postDelayed(() -> {
                      long after = avail(am);
                      ram.setText("RAM: " + after + " MB (" + Math.max(0L, after - before) + " MB mới)");
                      toast("Dọn xong!");
                      if (game != null) {
                          Intent it = pm.getLaunchIntentForPackage(game);
                          if (it != null) startActivity(it);
                          else toast("Chưa cài game");
                      }
                  }, 1500);
              }

              void cleanAll() { cleanAll(null); }

              void toggleAnim(boolean on) {
                  if (!canWrite()) { showPermDialog(); return; }
                  try {
                      ContentResolver cr = getContentResolver();
                      float v = on ? 0f : 1f;
                      if (on && !sp.contains("anim0")) {
                          SharedPreferences.Editor ed = sp.edit();
                          for (int i = 0; i < 3; i++) ed.putFloat("anim" + i, Settings.Global.getFloat(cr, ANIM_KEYS[i], 1f));
                          ed.apply();
                      }
                      for (int i = 0; i < 3; i++) Settings.Global.putFloat(cr, ANIM_KEYS[i], v);
                      if (!on) sp.edit().remove("anim0").apply();
                  } catch (Exception e) {
                      toast("Lỗi: " + e.getMessage());
                  }
                  refresh();
              }

              void toggleVib(boolean on) {
                  try {
                      if (on) {
                          if (!sp.contains("vib0")) {
                              SharedPreferences.Editor ed = sp.edit();
                              ed.putInt("vib_old", Settings.System.getInt(getContentResolver(), Settings.System.HAPTIC_FEEDBACK_ENABLED, 1));
                              ed.apply();
                          }
                          Settings.System.putInt(getContentResolver(), Settings.System.HAPTIC_FEEDBACK_ENABLED, 0);
                      } else {
                          int old = sp.getInt("vib_old", 1);
                          Settings.System.putInt(getContentResolver(), Settings.System.HAPTIC_FEEDBACK_ENABLED, old);
                          sp.edit().remove("vib_old").apply();
                      }
                  } catch (Exception e) {
                      toast("Lỗi rung: " + e.getMessage());
                  }
                  refresh();
              }

              void toggleGesture(boolean on) {
                  try {
                      if (on) {
                          if (!sp.contains("gest_old")) {
                              SharedPreferences.Editor ed = sp.edit();
                              ed.putInt("gest_old", Settings.System.getInt(getContentResolver(), "show_touches", 0));
                              ed.apply();
                          }
                          Settings.System.putInt(getContentResolver(), "system_navigation_keys_enabled", 1);
                      } else {
                          int old = sp.getInt("gest_old", 0);
                          Settings.System.putInt(getContentResolver(), "system_navigation_keys_enabled", old);
                          sp.edit().remove("gest_old").apply();
                      }
                  } catch (Exception e) {
                      toast("Lỗi gesture: " + e.getMessage());
                  }
                  refresh();
              }

              void clearCache() {
                  new Thread(() -> {
                      int cleared = 0;
                      PackageManager pm = getPackageManager();
                      for (ApplicationInfo ai : pm.getInstalledApplications(0)) {
                          if ((ai.flags & ApplicationInfo.FLAG_SYSTEM) != 0) continue;
                          try {
                              File cache = new File(ai.dataDir, "cache");
                              if (cache.exists()) deleteDir(cache);
                              cleared++;
                          } catch (Exception e) {}
                      }
                      final int total = cleared;
                      runOnUiThread(() -> toast("Xóa cache " + total + " app"));
                  }).start();
              }

              void deleteDir(File dir) {
                  if (dir.isDirectory()) {
                      for (File f : dir.listFiles() != null ? dir.listFiles() : new File[0]) deleteDir(f);
                  }
                  dir.delete();
              }

              void toggleConnectivity(boolean on) {
                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      if (Build.VERSION.SDK_INT >= 31) {
                          toast("Android 12+ không cho tắt WiFi từ app thường. Dùng Settings → WiFi");
                      }
                  } catch (Exception e) {
                      toast("Lỗi: " + e.getMessage());
                  }
              }

              void toggleAdaptive() {
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          Settings.System.putInt(getContentResolver(), "adaptive_battery_management_enabled", 0);
                          toast("Tắt Adaptive Battery");
                      } else {
                          toast("Máy bạn không hỗ trợ");
                      }
                  } catch (Exception e) {
                      toast("Lỗi: " + e.getMessage());
                  }
              }

              void openDev() {
                  try {
                      startActivity(new Intent(Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS));
                  } catch (Exception e) {
                      toast("Bấm 7 lần 'Số bản dựng' trong Giới thiệu để mở");
                  }
              }

              void openPerf() {
                  try {
                      Intent it = new Intent(Intent.ACTION_VIEW);
                      it.setData(android.net.Uri.parse("com.android.settings/com.android.settings.development.DevelopmentSettingsActivity"));
                      startActivity(it);
                  } catch (Exception e1) {
                      try {
                          startActivity(new Intent("android.settings.DEVICE_INFO_SETTINGS"));
                      } catch (Exception e2) {
                          openDev();
                      }
                  }
              }

              long avail(ActivityManager am) {
                  ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
                  am.getMemoryInfo(mi);
                  return mi.availMem / 1048576L;
              }

              boolean getVibState() {
                  try { return Settings.System.getInt(getContentResolver(), Settings.System.HAPTIC_FEEDBACK_ENABLED, 1) == 0; }
                  catch (Exception e) { return false; }
              }

              boolean getGestureState() {
                  try { return Settings.System.getInt(getContentResolver(), "system_navigation_keys_enabled", 0) == 0; }
                  catch (Exception e) { return false; }
              }

              void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_LONG).show(); }

              void showPermDialog() {
                  new AlertDialog.Builder(this)
                      .setTitle("Cần cấp quyền WRITE_SECURE_SETTINGS")
                      .setMessage("Chạy lệnh ADB trên máy tính:\nadb shell pm grant com.tsxpro.fixlag android.permission.WRITE_SECURE_SETTINGS\n\nHoặc dùng Shizuku (app hỗ trợ quyền ADB không dây)")
                      .setPositiveButton("Sao chép lệnh", (d, w) -> {
                          ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                          cm.setPrimaryClip(ClipData.newPlainText("cmd", CMD_ANIM));
                          toast("Đã sao chép");
                      })
                      .setNeutralButton("Mở Dev Settings", (d, w) -> openDev())
                      .show();
              }
          }
          JEOF
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TSX-PRO-FIXLAG-v03-apk
          path: app/build/outputs/apk/debug/app-debug.apk
