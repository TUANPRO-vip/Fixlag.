name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Unzip project if uploaded as ZIP
        shell: bash
        run: |
          if [ ! -f package.json ] && [ ! -f FIX-LAG-PRO/package.json ]; then
            ZIP_FILE=$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP_FILE" ]; then
              echo "No project files and no ZIP found" >&2
              exit 1
            fi
            echo "Unzipping $ZIP_FILE"
            unzip -q -o "$ZIP_FILE" -d .
          fi
      - name: Detect project folder
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f FIX-LAG-PRO/package.json ]; then
            echo "PROJECT_DIR=FIX-LAG-PRO" >> "$GITHUB_ENV"
          else
            echo "Could not find package.json" >&2
            exit 1
          fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install
      - name: Generate Android project if needed
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Sync web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSX-PRO-FIXLAG-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
